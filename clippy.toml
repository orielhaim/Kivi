# Kivi is a systems project; its vocabulary is full of hardware acronyms that
# are always identifiers and never prose. Listing them here keeps
# `clippy::doc_markdown` useful instead of noisy: it still flags a genuinely
# missing backtick around a Kivi type, but stops demanding one around `NEON`.
doc-valid-idents = [
    "AArch64",
    "AF_XDP",
    "AVX2",
    "AVX512",
    "CXL",
    "DAX",
    "DAMON",
    "DPDK",
    "DSA",
    "GFNI",
    "GiB",
    "HugePage",
    "IOCP",
    "IOMMU",
    "IOPOLL",
    "ISA",
    "KiB",
    "KV",
    "Mayastor",
    "MiB",
    "NEON",
    "NUMA",
    "NVMe",
    "NVM",
    "OS",
    "PMU",
    "RDMA",
    "RustCrypto",
    "SMT",
    "SPDK",
    "SQPOLL",
    "TLB",
    "VFIO",
    "WAL",
    "XDP",
    "io_uring",
]
