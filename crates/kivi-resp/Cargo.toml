[package]
name = "kivi-resp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
kivi-types.workspace = true
kivi-state.workspace = true
jiff.workspace = true
bytes.workspace = true
thiserror.workspace = true
redis-protocol = { version = "6.0.0", default-features = false, features = ["std", "bytes", "resp2", "resp3"] }

[dev-dependencies]
proptest.workspace = true
divan.workspace = true
# Allocation counting for the frontend bench. The workspace denies
# hand-written `unsafe`, and a `GlobalAlloc` counter cannot be written
# without it, so the measurement comes from a crate that carries its own.
dhat = "0.3"

[features]
# `cargo bench -p kivi-resp --bench frontend --features alloc-profile -- <shape>`
# prints allocations and bytes per request for one request shape.
alloc-profile = []

[[bench]]
name = "frontend"
harness = false

[lints]
workspace = true
