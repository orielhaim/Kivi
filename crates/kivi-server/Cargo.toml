[package]
name = "kivi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"

[[bin]]
name = "kivi-server"
path = "src/main.rs"

[[bin]]
name = "kivi-cli"
path = "src/bin/kivi-cli.rs"

[[bin]]
name = "kivi-peer-cert"
path = "src/bin/kivi-peer-cert.rs"

[features]
# The RESP edge is on by default. It is a first-class serving surface, not an
# experiment: the conformance and differential suites, the CLI's interactive mode
# and every benchmark target all speak it. Defaulting it *off* meant a plain
# `cargo build -p kivi-server` produced a binary with no wire protocol at all and
# no warning - a failure that surfaces as a connection refused much later, in a
# different process, with nothing pointing back here.
#
# A native-protocol-only build is a real deployment shape, so the distinction is
# kept rather than removed: `--no-default-features` gives it, and the server reports
# the edge as absent instead of pretending it is there but disabled.
default = ["redis-compat"]
redis-compat = ["dep:kivi-resp"]

[dependencies]
kivi-core.workspace = true
kivi-types.workspace = true
kivi-state.workspace = true
kivi-tablet.workspace = true
kivi-engine.workspace = true
kivi-client.workspace = true
kivi-consensus.workspace = true
kivi-protocol.workspace = true
kivi-durability.workspace = true
kivi-checkpoint.workspace = true
kivi-chunk.workspace = true
kivi-codec.workspace = true
kivi-control = { path = "../kivi-control", version = "0.1.0" }
kivi-memory = { path = "../kivi-memory", version = "0.1.0" }
kivi-hardware.workspace = true
kivi-observation = { path = "../kivi-observation", version = "0.1.0" }
kivi-redundancy.workspace = true
base64 = "0.23"
kivi-resp = { workspace = true, optional = true }
bytes.workspace = true
arc-swap.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
file-rotate.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
# Compio runtime for polling redundancy futures (Kivi's data plane; the
# admin surface is Tokio and bridges through a blocking thread).
compio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

