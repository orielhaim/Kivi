[package]
name = "kivi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kivi-server"
path = "src/main.rs"

[[bin]]
name = "kivi-cli"
path = "src/bin/kivi-cli.rs"

[features]
default = []
# Optional Redis/RESP compatibility edge (default-off). Production serving
# needs only kivi-resp + redis-protocol; benchmark/reference clients live
# in kivi-lab and never enter this graph.
redis-compat = ["dep:kivi-resp"]

[dependencies]
kivi-types.workspace = true
kivi-state.workspace = true
kivi-tablet.workspace = true
kivi-engine.workspace = true
kivi-client.workspace = true
kivi-protocol.workspace = true
kivi-durability.workspace = true
kivi-checkpoint.workspace = true
kivi-resp = { workspace = true, optional = true }
bytes.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
