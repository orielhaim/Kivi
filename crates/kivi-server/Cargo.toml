[package]
name = "kivi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"

[[bin]]
name = "kivi-server"
path = "src/main.rs"

[[bin]]
name = "kivi-cli"
path = "src/bin/kivi-cli.rs"

[[bin]]
name = "kivi-peer-cert"
path = "src/bin/kivi-peer-cert.rs"

[features]
default = []
# Optional Redis/RESP compatibility edge (default-off). Production serving
# needs only kivi-resp + redis-protocol; benchmark/reference clients live
# in kivi-lab and never enter this graph.
redis-compat = ["dep:kivi-resp"]

[dependencies]
kivi-core.workspace = true
kivi-types.workspace = true
kivi-state.workspace = true
kivi-tablet.workspace = true
kivi-engine.workspace = true
kivi-client.workspace = true
kivi-consensus.workspace = true
kivi-protocol.workspace = true
kivi-durability.workspace = true
kivi-checkpoint.workspace = true
kivi-chunk.workspace = true
kivi-codec.workspace = true
kivi-control = { path = "../kivi-control", version = "0.1.0" }
kivi-redundancy.workspace = true
base64 = "0.23"
kivi-resp = { workspace = true, optional = true }
bytes.workspace = true
arc-swap.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
file-rotate.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
# Compio runtime for polling redundancy futures (Kivi's data plane; the
# admin surface is Tokio and bridges through a blocking thread).
compio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

